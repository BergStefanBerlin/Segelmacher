meta:
  schema_version: 1
  sources:
    int420:   "https://media.sailing.org/sailing/wp-content/uploads/2022/03/17092130/420_CR_2026-03-31.pdf"
    club420:  "https://club420.org/"
    optimist: "IODA Sail Plan, March 1994 (5 Blaetter)"
    folkboat: "Nordic Folkboat International Class Rules"

sails:

  # ------------------------------------------------------------------
  420_MAIN:
    class: "International 420"          # TODO_HUMAN: Int. 420 ODER Club 420?
    source_section: "Int. 420 Class Rules 2026, Section G.3 Mainsail, S. 29"
    luff_m: null                        # TODO_HUMAN
    foot_m: null                        # TODO_HUMAN
    headboard_m: null                   # TODO_HUMAN
    roach_m: null                       # TODO_HUMAN Achterlieksrundung
    area_m2: null                       # TODO_HUMAN
    tack_position_m: [0.0, 0.0, null]   # TODO_HUMAN Gooseneck-Hoehe ueber Deck
    mast_diameter_m: null               # TODO_HUMAN
    scale_factor_luff: 0.995            # Ist-Annahme: gefahren ~99.5 % des Maximums
    scale_factor_foot: 0.970

